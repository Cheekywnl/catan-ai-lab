name: Verify research workspace
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - run: python -m pytest -q
      - run: python scripts/build-engine.py
      - name: Check tested Python bundle is committed
        run: git diff --exit-code -- dist/engine-source.zip dist/engine-build.json dist/engine-validation.json dist/implementation.md dist/strength-v2.json dist/solver-mathematics.md dist/refinement-log.md dist/strength-v3.json dist/speed-v3.json dist/strength-v3-original.json dist/search-repair-v3.json dist/development-history-v032.json dist/search12-v031-comparison.json
      - run: npm run content
      - name: Check generated content is committed
        run: git diff --exit-code -- dist/content.json dist/catan-ai-research.md
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
